[pytest]
asyncio_mode = strict
asyncio_default_test_loop_scope = function
asyncio_default_fixture_loop_scope = function
testpaths = tests
# importlib 模式：仓库根的插件 __init__.py（相对导入 + 目录名带连字符）
# 不能被 pytest 以顶层 "__init__" 名导入（prepend 模式会炸）；importlib 模式
# 用 spec 加载并带上正确的包上下文。
addopts = --import-mode=importlib
