name: tests

# 单元测试跑在「插件 + hermes-agent（宿主框架）」两个仓库的组合上：
# 插件依赖宿主注入的 gateway.* 模块，所以每次都要拉一份 hermes-agent。
#
# 测试环境直接用 hermes-agent 自己的 venv（uv sync，含 dev 组的 pytest）：
# 插件 import 的是宿主的 gateway.*，依赖面由宿主的 uv.lock 决定，自己再维护
# 一份「最小包列表」会随宿主内部 import 变化而静默失效（实测：curated
# 三包环境在 Linux 缺 ruamel.yaml，`gateway.platforms.base` → utils → hermes_yaml
# 一链就断）。代价是 CI 多一次宿主全量 sync（uv cache 命中后十几秒）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: hermes-onebot-adapter

      # ref 可用仓库变量 HERMES_AGENT_REF 钉到某个 commit/tag：
      # Settings → Variables → Actions 新建该变量即可，默认跟 main。
      - name: Checkout hermes-agent
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ vars.HERMES_AGENT_REF || 'main' }}
          path: hermes-agent
          fetch-depth: 1

      - name: Install uv
        # setup-uv 只发精确版本 tag（没有浮动的大版本 v10），必须写全 vX.Y.Z；
        # 上游发新版时手动 bump。
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync hermes-agent environment
        working-directory: hermes-agent
        # hermes-agent 的 [tool.uv] default-groups = []，plain uv sync 不装 dev 组
        # （pytest/pytest-asyncio 在 dev 里），必须显式 --group dev。
        run: uv sync --group dev

      - name: Run tests
        working-directory: hermes-onebot-adapter
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        # aiohttp 是插件自身的运行依赖（适配器 + 测试 harness 都用它），但宿主
        # 把它放在 messaging extra 里——全量 sync 那个 extra 会拖进 telegram/discord
        # 一堆无关包，所以这里单独 --with，沿用宿主同一个 CVE pin。
        run: >-
          uv run --project ../hermes-agent --no-sync
          --with aiohttp==3.14.5
          python -m pytest tests/ -q
