name: tests

# 单元测试跑在「插件 + hermes-agent（宿主框架）」两个仓库的组合上：
# 插件依赖宿主注入的 gateway.* 模块，所以每次都要拉一份 hermes-agent。
# hermes-agent 的 pyproject 只支持 3.14 运行时（uv.lock 亦然），故 --python 3.14。
#
# 依赖刻意**不**同步 hermes-agent 的 356 包全量环境：测试只 import 少量
# gateway.* 模块，三个显式 pin 的包（pytest / pytest-asyncio / aiohttp）足够，
# 冷启动从分钟级压到秒级。三个 pin 与 hermes-agent 当前 pyproject 的版本一致——
# 上游 bump 时这里可以不动（旧 pin 仍可用），改了记得同步。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: hermes-onebot-adapter

      # ref 可用仓库变量 HERMES_AGENT_REF 钉到某个 commit/tag：
      # Settings → Variables → Actions 新建该变量即可，默认跟 main。
      - name: Checkout hermes-agent
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ vars.HERMES_AGENT_REF || 'main' }}
          path: hermes-agent
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Run tests
        working-directory: hermes-onebot-adapter
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: >-
          uv run --python 3.14
          --with pytest==9.1.1
          --with pytest-asyncio==1.4.0
          --with aiohttp==3.14.5
          python -m pytest tests/ -q
